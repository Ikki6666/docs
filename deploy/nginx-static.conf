server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</head>' '<script src="/local-origin-fix.js"></script></head>';

    location = /local-origin-fix.js {
        alias /etc/nginx/local-origin-fix.js;
        add_header Cache-Control "no-cache";
    }

    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/index.html $uri/index/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }
}

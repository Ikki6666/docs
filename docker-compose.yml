services:
  # Static documentation server - serves pre-built docs
  # Use: docker compose up --build -d (static mode)
  langchain-docs-static:
    build:
      context: .
      args:
        BUILD_MODE: static
    image: langchain-docs-zh:local
    ports:
      - "33030:80"
    restart: unless-stopped

  # Dynamic development server - watches for file changes (default mode)
  # Use: docker compose up -d (dynamic mode)
  langchain-docs-dev:
    build:
      context: .
    image: langchain-docs-zh:local
    container_name: langchain-docs-dev
    volumes:
      - .:/app:cached
    environment:
      - BUILD_MODE=dynamic
    ports:
      - "3000:3000"
    restart: unless-stopped

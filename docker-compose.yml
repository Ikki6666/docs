services:
  langchain-docs-zh-static:
    image: nginx:1.27-alpine
    ports:
      - "33031:80"
    volumes:
      - ./build/static-site:/usr/share/nginx/html:ro
      - ./deploy/local-origin-fix.js:/etc/nginx/local-origin-fix.js:ro
      - ./deploy/nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

# Build the Chinese docs overlay and sync the output to the Mintlify deploy
# branch (mintlify-deploy-zh), which Mintlify cloud builds directly. The
# deploy branch holds generated content only; do not edit it by hand.
# Rerun manually from the Actions tab ("Run workflow") to rebuild without
# new commits. If Actions is unavailable, run "make mintlify-deploy-zh" locally.
name: Deploy Chinese docs to Mintlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mintlify-deploy-zh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Pin Python: uv otherwise selects 3.15, and psycopg-binary 3.3.3 has
      # no cp315 wheel. Keep this aligned with publish.yml.
      - name: Set up Python 3.13 + uv
        uses: "./.github/actions/uv_setup"
        with:
          python-version: '3.13'

      - name: Build Chinese docs
        run: make build-zh

      - name: Sync to deploy branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/sync_mintlify_deploy.sh --no-build
